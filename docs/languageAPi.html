<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portadas en Español por Libro</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f2ee;
    margin: 0;
    padding: 2rem 1rem;
    color: #2b2b2b;
  }
  .container {
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    margin-bottom: 0.3rem;
  }
  .subtitulo {
    text-align: center;
    color: #777;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }
  .search-bar {
    display: flex;
    gap: 0.5rem;
    max-width: 500px;
    margin: 0 auto 1.5rem auto;
  }
  .search-bar input {
    flex: 1;
    padding: 0.7rem 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }
  .search-bar button {
    padding: 0.7rem 1.2rem;
    border: none;
    border-radius: 6px;
    background: #2b6cb0;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  .search-bar button:hover { background: #1e4e8c; }

  #status {
    text-align: center;
    color: #777;
    margin-bottom: 1rem;
    min-height: 1.2em;
  }

  .libro-info {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  .libro-info h2 { margin: 0 0 0.2rem 0; }
  .libro-info p { margin: 0; color: #666; }
  .libro-info a { color: #2b6cb0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1.2rem;
  }
  .card {
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #e0e0e0;
  }
  .card .info {
    padding: 0.6rem 0.7rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    font-size: 0.78rem;
  }
  .card .idioma {
    display: inline-block;
    align-self: flex-start;
    background: #e8f0fe;
    color: #1a56a0;
    padding: 0.1rem 0.5rem;
    border-radius: 10px;
    font-weight: 600;
  }
  .card .edicion-titulo {
    font-weight: 600;
    line-height: 1.2;
  }
  .card .fuente {
    color: #999;
    word-break: break-all;
    font-size: 0.7rem;
    margin-top: auto;
  }
  .card .fuente a { color: #999; }
</style>
</head>
<body>
  <div class="container">
    <h1>📚 Portadas en Español</h1>
    <p class="subtitulo">Buscá un libro y mirá las portadas disponibles de sus ediciones en español, con el origen de cada una</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Título del libro..." value="Cien años de soledad">
      <button id="searchBtn">Buscar</button>
    </div>
    <div id="status"></div>
    <div class="libro-info" id="libroInfo"></div>
    <div class="grid" id="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
